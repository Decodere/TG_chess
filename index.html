<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telegram Chess — Multiplayer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --sq-light: #e2e8f0;
      --sq-dark: #475569;
      --sq-sel: rgba(56, 189, 248, 0.55);
      --sq-last: rgba(250, 204, 21, 0.4);
      --sq-check: rgba(239, 68, 68, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .room-banner {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .role-badge {
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }
    .sync-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      margin-right: 6px;
    }
    .sync-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

    /* Плашки игроков с аватарками */
    .player-bar {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .player-bar.active-turn {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.22);
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .avatar-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      overflow: hidden;
      border: 2px solid #334155;
    }
    .player-bar.active-turn .avatar-wrap {
      border-color: var(--accent);
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .name-stack {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .player-name {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 185px;
    }
    .player-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .turn-pill {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 6px;
      background: #334155;
      color: var(--muted);
      flex-shrink: 0;
    }
    .player-bar.active-turn .turn-pill {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
    }
    .sq {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .sq.light { background: var(--sq-light); }
    .sq.dark { background: var(--sq-dark); }
    .sq.selected { background: var(--sq-sel) !important; }
    .sq.last-move { background: var(--sq-last) !important; }
    .sq.in-check { background: var(--sq-check) !important; }

    .coord-rank, .coord-file {
      position: absolute;
      font-size: 9px;
      font-weight: 700;
      pointer-events: none;
      opacity: 0.75;
    }
    .coord-rank { top: 2px; left: 3px; }
    .coord-file { bottom: 1px; right: 3px; }
    .sq.light .coord-rank, .sq.light .coord-file { color: #334155; }
    .sq.dark .coord-rank, .sq.dark .coord-file { color: #e2e8f0; }

    .move-dot {
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.45);
      pointer-events: none;
      z-index: 2;
    }
    .capture-ring {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 4px solid rgba(239, 68, 68, 0.65);
      pointer-events: none;
      z-index: 2;
    }
    .castle-ring {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 4px solid rgba(56, 189, 248, 0.8);
      pointer-events: none;
      z-index: 2;
    }
    .piece-svg {
      width: 84%;
      height: 84%;
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
    }

    .status-bar {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }
    .status-bar.game-over {
      border-color: #eab308;
      background: rgba(234, 179, 8, 0.12);
      color: #fef08a;
    }

    .controls { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 10px 6px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn.btn-danger {
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="container">
  <div class="room-banner">
    <div><span id="syncDot" class="sync-dot"></span><span id="roomTitle">Локальная партия</span></div>
    <div id="roleBadge" class="role-badge">🎮 Хотсит</div>
  </div>

  <!-- Верхний игрок -->
  <div id="topBar" class="player-bar">
    <div class="player-info">
      <div class="avatar-wrap">
        <span id="topInitials">⚫️</span>
        <img id="topAvatar" alt="" />
      </div>
      <div class="name-stack">
        <span id="topName" class="player-name">Черные</span>
        <span id="topSub" class="player-sub">⚫️ Черные фигуры</span>
      </div>
    </div>
    <span id="topTurnPill" class="turn-pill">Ожидание</span>
  </div>

  <!-- Доска -->
  <div class="board-wrap">
    <div id="board" class="board"></div>
  </div>

  <!-- Нижний игрок -->
  <div id="bottomBar" class="player-bar active-turn">
    <div class="player-info">
      <div class="avatar-wrap">
        <span id="bottomInitials">⚪️</span>
        <img id="bottomAvatar" alt="" />
      </div>
      <div class="name-stack">
        <span id="bottomName" class="player-name">Белые</span>
        <span id="bottomSub" class="player-sub">⚪️ Белые фигуры</span>
      </div>
    </div>
    <span id="bottomTurnPill" class="turn-pill">Ваш ход</span>
  </div>

  <div id="statusText" class="status-bar">⚪️ Ход Белых</div>

  <!-- Панель из 3 кнопок: Перевернуть, Сдаться, Реванш -->
  <div class="controls">
    <button class="btn" onclick="flipBoard()">🔄 Вид</button>
    <button id="resignBtn" class="btn btn-danger" onclick="requestResign()">🏳️ Сдаться</button>
    <button id="resetBtn" class="btn" onclick="requestReset()">🔁 Реванш</button>
  </div>
</div>

<div id="toast" class="toast"></div>

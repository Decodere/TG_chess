<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telegram Chess — Multiplayer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --sq-light: #e2e8f0;
      --sq-dark: #475569;
      --sq-sel: rgba(56, 189, 248, 0.55);
      --sq-last: rgba(250, 204, 21, 0.4);
      --sq-check: rgba(239, 68, 68, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .room-banner {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .role-badge {
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }
    .sync-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      margin-right: 6px;
    }
    .sync-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

    /* Плашки игроков с аватарками */
    .player-bar {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .player-bar.active-turn {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.22);
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .avatar-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      overflow: hidden;
      border: 2px solid #334155;
    }
    .player-bar.active-turn .avatar-wrap {
      border-color: var(--accent);
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .color-dot {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--card);
    }
    .color-dot.white { background: #f8fafc; }
    .color-dot.black { background: #0f172a; border-color: #94a3b8; }

    .name-stack {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .player-name {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 185px;
    }
    .player-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .turn-pill {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 6px;
      background: #334155;
      color: var(--muted);
      flex-shrink: 0;
    }
    .player-bar.active-turn .turn-pill {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
